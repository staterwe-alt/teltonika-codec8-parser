[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teltonika-codec8-parser"
version = "0.1.0"
description = "Zero-dependency Python parser for Teltonika Codec 8 / 8 Extended AVL packets with CRC-16 validation and SAE J2012 DTC decoding."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Kacper"}
]
keywords = ["teltonika", "codec8", "codec8e", "iot", "telematics", "obd2", "dtc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
teltonika-parser = "teltonika_codec8.cli:main"

[tool.setuptools.packages.find]
include = ["teltonika_codec8*"]
